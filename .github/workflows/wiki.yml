name: Wiki Sync

# docs/ の変更を GitHub Wiki (<repo>.wiki.git) へ自動同期する。
# 正本は docs/ と docs/wiki/。Wiki は生成物なので直接編集しない。
on:
  push:
    paths:
      - "docs/**"
      - "README.md"
      - "scripts/sync-wiki.mjs"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write
  pages: read

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (main)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout (wiki)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Generate wiki pages
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL }}
          REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -z "$PAGES_BASE_URL" ]; then
            PAGES_BASE_URL=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url') || {
              echo 'GitHub Pages の URL を取得できません。Pages を有効にするか、PAGES_BASE_URL を設定してください。' >&2
              exit 1
            }
            if [[ "$PAGES_BASE_URL" == http://* ]]; then
              secure_url="https://${PAGES_BASE_URL#http://}"
              if curl --fail --silent --location --head --proto '=https' --proto-redir '=https' --max-time 10 "$secure_url" >/dev/null; then
                PAGES_BASE_URL="$secure_url"
              fi
            fi
          fi
          export PAGES_BASE_URL
          node scripts/sync-wiki.mjs wiki

      - name: Push wiki
        working-directory: wiki
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki に変更なし"
            exit 0
          fi
          git commit -m "docs から自動同期 (${GITHUB_SHA::7})"
          git push
