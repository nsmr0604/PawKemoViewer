name: Linux installed candidate smoke

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: デスクトップ検証ビルドの Actions 実行 ID
        type: string
        required: true

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download the selected Linux candidate
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.artifact_run_id }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$BUILD_RUN_ID" --name PawKemoViewer-Desktop-Test-linux --dir artifacts
          dpkg-deb -f artifacts/*.deb Package Version Architecture

      - name: Install the package and the smoke test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y "$PWD"/artifacts/*.deb xvfb xauth dbus-x11 at-spi2-core python3-pyatspi

      - name: Verify WebView and public API through the installed app
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" dbus-run-session -- \
            /usr/bin/python3 tests/linux_installed_smoke.py
