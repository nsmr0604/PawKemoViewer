name: Android Build

on:
  push:
    branches:
      - main
    # ビルド関連ファイルの変更時のみ発火 (ドキュメントのみのコミットではスキップ)
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"

  workflow_dispatch:
    inputs:
      debug_diag:
        description: "デバッグ診断コードを注入する (VITE_DEBUG_DIAG=1・リリース添付はされない)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        # デバッグ診断コードはビルド時フラグで注入する (src/debug.ts 参照)。
        # push (リリース) ビルドでは常に空 = 分離される
        env:
          VITE_DEBUG_DIAG: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_diag && '1' || '' }}
        run: npm run build

      - name: Initialize Android
        run: |
          npx tauri android init

      - name: Build APK
        run: |
          npx tauri android build

      - name: Sign APKs (debug keystore / 開発用仮署名)
        # 標準手順の debug.keystore を使用。パスワード "android" は Android SDK の
        # 公開定数 (debug.keystore は開発環境共通) のため直書き可 (例外規定: AGENT.md 参照)。
        # 秘密鍵 (正式リリース用の鍵) では GitHub Secrets を使うこと
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          KS="$GITHUB_WORKSPACE/src-tauri/android-debug.keystore"
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist-apk

          for apk in $(find src-tauri/gen/android/app/build/outputs -type f -name "*.apk"); do
            base=$(basename "$apk")
            # app-{abi}-release.apk / app-{abi}-unsigned-release.apk から abi を抽出
            abi=$(echo "$base" | sed -n 's/^app-\([a-z0-9_]*\)-\(unsigned-\)\{0,1\}release\.apk$/\1/p')
            if [ -z "$abi" ]; then abi="universal"; fi
            out="dist-apk/Pawchive.Viewer_${VER}_${abi}.apk"

            "$BT/zipalign" -f -p 4 "$apk" "$out.aligned"
            "$BT/apksigner" sign \
              --ks "$KS" \
              --ks-pass 'pass:android' \
              --key-pass 'pass:android' \
              --ks-key-alias androiddebugkey \
              --out "$out" "$out.aligned"
            "$BT/apksigner" verify "$out"
            rm -f "$out.aligned"
            echo "signed: $out"
          done

          ls -la dist-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawchive-android
          path: dist-apk/*.apk

      - name: Attach APK to Release
        # デバッグ診断ビルド (debug_diag=true) はリリースへ添付しない (artifact のみ)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.debug_diag) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          gh release upload "pawchive-v${VER}" dist-apk/*.apk --clobber \
            || gh release create "pawchive-v${VER}" dist-apk/*.apk \
                 --title "Pawchive Viewer v${VER}" \
                 --notes "Automated build (APK: dev-signed for testing)."
