name: Android Build
run-name: ${{ github.workflow }} - ${{ github.event.head_commit.message || (inputs.release && 'manual release' || 'manual debug') }}

on:
  push:
    branches:
      - main
      # バージョン番号のブランチ (例: 0.6.0) でも開発ビルドを作る
      - "[0-9]*.[0-9]*.[0-9]*"
    # ビルド関連ファイルの変更時のみ発火 (ドキュメントのみのコミットではスキップ)
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/app-icon/**"
      - "scripts/generate-icons.mjs"
      - "scripts/check-locales.mjs"
      - "scripts/dev-version.mjs"
      - "scripts/sync-version.mjs"
      - "scripts/ci/**"
      - "src-tauri/app-icons.json"
      - "src-tauri/app-icons/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "正式リリースビルド (診断コード無し・pawkemoviewer-v{VER} リリースへ添付)。無指定時はデバッグビルド"
        type: boolean
        default: false
      locale_test:
        description: "言語ファイル検証用のアプリ ID でビルド (デバッグ・成果物のみ)"
        type: boolean
        default: false
      artifact_only:
        description: "成果物を Actions にのみ保存"
        type: boolean
        default: false


concurrency:
  group: android-build-${{ github.ref }}-${{ inputs.release == true && 'release' || 'debug' }}-${{ inputs.locale_test && 'validation' || 'standard' }}
  cancel-in-progress: ${{ inputs.release != true }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      # push = デバッグビルド (診断コード VITE_DEBUG_DIAG=1 を注入)。
      # 手動 release=true のみ診断コード無しの正式リリースビルド。
      # ジョブレベルで設定する (tauri build の beforeBuildCommand でも同じフラグを使うため)
      # 注意: `true && '' || '1'` は空文字が偽のため '1' になる。リリースは '0' を明示する
      VITE_DEBUG_DIAG: ${{ inputs.release == true && '0' || '1' }}
      # デバッグビルドの表記用ビルド番号 (バージョン番号は変えない)。リリースは 'release'
      VITE_BUILD_REV: ${{ inputs.release == true && 'release' || github.run_number }}
      VITE_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 製品版と検証モードの同時指定を拒否
        if: inputs.release && inputs.locale_test
        run: |
          echo "locale_test requires a debug build" >&2
          exit 1

      - name: Show recent commits
        shell: bash
        run: |
          {
            echo '### 最近のコミット (このビルド)'
            git log -5 --pretty=format:'- %h %s'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: 開発版のバージョン
        if: inputs.release != true
        shell: bash
        run: node scripts/dev-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Cargo.toml の rust-version と揃える
          toolchain: "1.100.0"

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Install Dependencies
        run: npm ci

      - name: 言語検証用のアプリ ID を設定
        if: inputs.locale_test
        run: node scripts/ci/set-locale-test-id.mjs

      - name: Build Frontend
        # ジョブレベル env (VITE_DEBUG_DIAG) を使用
        run: npm run build

      - name: Generate native app icons
        # src-tauri/icons/ は git 管理外。init 前に dark から生成しておく
        run: npm run icons:generate

      - name: Initialize Android
        run: |
          npx tauri android init

      - name: Apply primary (dark) app icon
        # gen/android が存在すると tauri icon は生成先 res/ へ直接書き込むため、
        # init 後に dark を再適用して primary を確実にする
        run: npx tauri icon src-tauri/app-icons/dark.png

      - name: Generate alternate app icon (light)
        # 既定アイコンは dark (ic_launcher)。light のみ代替 alias として生成。
        # テーマ切替は tauri-plugin-app-icon が行う。
        run: |
          node scripts/app-icon/generate-android.mjs --config src-tauri/app-icons.json
          grep -c 'tauri-plugin-app-icon-id' src-tauri/gen/android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          if [ "${{ inputs.release }}" = "true" ]; then
            npx tauri android build
          else
            npx tauri android build --features debug-diag
          fi

      - name: Sign APKs
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # 正式リリースは release key (Secrets) で署名する。開発ビルドだけ debug.keystore。
        # debug.keystore のパスワード "android" は公開定数のため直書き可 (AGENT.md 参照)。
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          VER=$(node -p "require('./package.json').version")
          mkdir -p dist-apk

          if [[ "${{ inputs.release }}" == "true" ]]; then
            if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" ]]; then
              echo "Release signing secrets are not configured (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS)" >&2
              exit 1
            fi
            KS="$RUNNER_TEMP/release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
            ALIAS="$ANDROID_KEY_ALIAS"
          else
            KS="$GITHUB_WORKSPACE/src-tauri/android-debug.keystore"
            KS_PASS="android"
            KEY_PASS="android"
            ALIAS="androiddebugkey"
          fi

          mapfile -d '' -t packages < <(find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -print0)
          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "No APK found" >&2
            exit 1
          fi
          for apk in "${packages[@]}"; do
            base=$(basename "$apk")
            # app-{abi}-release.apk / app-{abi}-unsigned-release.apk から abi を抽出
            abi=$(echo "$base" | sed -n 's/^app-\([a-z0-9_]*\)-\(unsigned-\)\{0,1\}release\.apk$/\1/p')
            if [ -z "$abi" ]; then abi="universal"; fi
            out="dist-apk/PawKemoViewer_${VER}_${abi}.apk"
            if [[ "${{ inputs.release }}" == true ]]; then
              out="dist-apk/PawKemoViewer_${abi}.apk"
              if [[ "$abi" == universal ]]; then out="dist-apk/PawKemoViewer.apk"; fi
            fi

            "$BT/zipalign" -f -p 4 "$apk" "$out.aligned"
            "$BT/apksigner" sign \
              --ks "$KS" \
              --ks-pass "pass:$KS_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --ks-key-alias "$ALIAS" \
              --out "$out" "$out.aligned"
            "$BT/apksigner" verify --print-certs "$out"
            rm -f "$out.aligned"
            echo "signed: $out"
          done

          ls -la dist-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pawchive-android
          path: dist-apk/*.apk
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.artifact_only != true && inputs.locale_test != true && (inputs.release != true || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pawchive-android
          path: artifacts

      - name: GitHub Releases に公開
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.release == true && 'release' || 'debug' }}
        run: bash scripts/ci/publish-build.sh android "$BUILD_MODE" artifacts
