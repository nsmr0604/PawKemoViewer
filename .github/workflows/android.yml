name: Android Build

on:
  push:
    branches:
      - main
    # ビルド関連ファイルの変更時のみ発火 (ドキュメントのみのコミットではスキップ)
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "正式リリースビルド (診断コード無し・pawkemoviewer-v{VER} リリースへ添付)。無指定時はデバッグビルド"
        type: boolean
        default: false

# 同一ブランチ/PR の新しいビルドを優先し、古い実行中ビルドはキャンセルする
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:

  build:

    runs-on: ubuntu-24.04

    env:
      # push / PR = デバッグビルド (診断コード VITE_DEBUG_DIAG=1 を注入)。
      # 手動 release=true のみ診断コード無しの正式リリースビルド。
      # ジョブレベルで設定する (tauri build の beforeBuildCommand でも同じフラグを使うため)
      # 注意: `true && '' || '1'` は空文字が偽のため '1' になる。リリースは '0' を明示する
      VITE_DEBUG_DIAG: ${{ inputs.release == true && '0' || '1' }}
      # デバッグビルドの表記用ビルド番号 (バージョン番号は変えない)。リリースは 'release'
      VITE_BUILD_REV: ${{ inputs.release == true && 'release' || github.run_number }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        # ジョブレベル env (VITE_DEBUG_DIAG) を使用
        run: npm run build

      - name: Initialize Android
        run: |
          npx tauri android init

      - name: Build APK
        run: |
          npx tauri android build

      - name: Sign APKs (debug keystore / 開発用仮署名)
        # 標準手順の debug.keystore を使用。パスワード "android" は Android SDK の
        # 公開定数 (debug.keystore は開発環境共通) のため直書き可 (例外規定: AGENT.md 参照)。
        # 秘密鍵 (正式リリース用の鍵) では GitHub Secrets を使うこと
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          KS="$GITHUB_WORKSPACE/src-tauri/android-debug.keystore"
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p dist-apk

          for apk in $(find src-tauri/gen/android/app/build/outputs -type f -name "*.apk"); do
            base=$(basename "$apk")
            # app-{abi}-release.apk / app-{abi}-unsigned-release.apk から abi を抽出
            abi=$(echo "$base" | sed -n 's/^app-\([a-z0-9_]*\)-\(unsigned-\)\{0,1\}release\.apk$/\1/p')
            if [ -z "$abi" ]; then abi="universal"; fi
            out="dist-apk/PawKemoViewer_${VER}_${abi}.apk"

            "$BT/zipalign" -f -p 4 "$apk" "$out.aligned"
            "$BT/apksigner" sign \
              --ks "$KS" \
              --ks-pass 'pass:android' \
              --key-pass 'pass:android' \
              --ks-key-alias androiddebugkey \
              --out "$out" "$out.aligned"
            "$BT/apksigner" verify "$out"
            rm -f "$out.aligned"
            echo "signed: $out"
          done

          ls -la dist-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pawchive-android
          path: dist-apk/*.apk

      - name: Attach APK to Release
        # push (main) = デバッグビルド → rolling prerelease `debug-latest` へ添付
        # (旧バージョンのアセットは掃除する)。
        # 手動 release=true のみ正式リリース pawkemoviewer-v{VER} へ添付。
        # PR ビルドは artifact のみ (リリースへは出さない)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")

          if [ "${{ inputs.release }}" = "true" ]; then
            gh release upload "pawkemoviewer-v${VER}" dist-apk/*.apk --clobber \
              || gh release create "pawkemoviewer-v${VER}" dist-apk/*.apk \
                   --title "PawKemoViewer v${VER}" \
                   --notes "Automated build (APK: dev-signed for testing)."
            exit 0
          fi

          # --- デバッグビルド: rolling prerelease debug-latest ---
          TAG=debug-latest
          SHA=$(git rev-parse --short HEAD)

          # 現行バージョン以外のアセットを掃除 (バージョンはファイル名に含まれる)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r a; do
              case "$a" in
                *"_${VER}_"*) ;; # 現行バージョンは残す
                *) gh release delete-asset "$TAG" "$a" --yes || true ;;
              esac
            done
          fi

          gh release upload "$TAG" dist-apk/*.apk --clobber \
            || gh release create "$TAG" dist-apk/*.apk \
                 --prerelease \
                 --title "PawKemoViewer debug build" \
                 --notes "Automated debug build (${SHA}, v${VER}). デバッグ診断コード有効 (VITE_DEBUG_DIAG=1・テスト用・非公式)."
