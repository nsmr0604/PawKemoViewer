name: macOS Build
run-name: ${{ github.workflow }} - ${{ inputs.release == true && 'release' || 'debug' }} - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: "正式リリースビルド (診断コード無し・pawkemoviewer-v{VER} リリースへ添付)。無指定時はデバッグビルド"
        type: boolean
        default: false
      installed_smoke:
        description: "macOS のインストールと起動を検証 (デバッグ・成果物のみ)"
        type: boolean
        default: false
      artifact_only:
        description: "成果物を Actions にのみ保存"
        type: boolean
        default: false

concurrency:
  group: macos-build-${{ github.ref }}-${{ inputs.release == true && 'release' || 'debug' }}-${{ inputs.installed_smoke && 'validation' || 'standard' }}
  cancel-in-progress: ${{ inputs.release != true }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VITE_DEBUG_DIAG: ${{ inputs.release == true && '0' || '1' }}
      VITE_BUILD_REV: ${{ inputs.release == true && 'release' || github.run_number }}
      VITE_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 製品版と起動検証の同時指定を拒否
        if: inputs.release && inputs.installed_smoke
        run: |
          echo "installed_smoke requires a debug build" >&2
          exit 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: 開発版のバージョン
        if: inputs.release != true
        shell: bash
        run: node scripts/dev-version.mjs

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          # Cargo.toml の rust-version と揃える
          toolchain: "1.100.0"

      - run: npm ci
      - run: npm run icons:generate

      - name: Tauri をビルド
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.release == true && 'release' || 'debug' }}
        run: |
          if [[ "$BUILD_MODE" == release ]]; then
            npx tauri build
          else
            npx tauri build --features debug-diag
          fi

      - name: macOS のアプリをアーカイブ
        env:
          BUILD_MODE: ${{ inputs.release == true && 'release' || 'debug' }}
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/dmg/*.dmg)
          test "${#packages[@]}" -eq 1
          app=src-tauri/target/release/bundle/macos/PawKemoViewer.app
          plist="$app/Contents/Info.plist"
          exe=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")
          icon=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIconFile' "$plist")
          test -x "$app/Contents/MacOS/$exe"
          test -s "$app/Contents/Resources/$icon"
          mkdir -p artifacts
          node scripts/ci/stage-desktop-assets.mjs macos "$BUILD_MODE" src-tauri/target/release/bundle/dmg artifacts
          archive=PawKemoViewer_aarch64.app.tar.gz
          if [[ "$BUILD_MODE" == release ]]; then archive=PawKemoViewer.app.tar.gz; fi
          tar -czf "artifacts/$archive" \
            -C src-tauri/target/release/bundle/macos PawKemoViewer.app

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: PawKemoViewer-macos
          path: artifacts/*
          if-no-files-found: error

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: inputs.installed_smoke
        with:
          python-version: "3.12"

      - name: macOS に配置して起動
        if: inputs.installed_smoke
        timeout-minutes: 12
        env:
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          dmg=$(find src-tauri/target/release/bundle/dmg -type f -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          app="$RUNNER_TEMP/PawKemoViewer.app"
          ditto "$mount/PawKemoViewer.app" "$app"
          exe=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          python tests/desktop_installed_smoke.py "$app/Contents/MacOS/$exe"

  publish:
    needs: build
    if: inputs.artifact_only != true && inputs.installed_smoke != true && (inputs.release != true || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: PawKemoViewer-macos
          path: artifacts

      - name: GitHub Releases に公開
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.release == true && 'release' || 'debug' }}
        run: bash scripts/ci/publish-build.sh macos "$BUILD_MODE" artifacts
