name: iOS Build
run-name: ${{ github.workflow }} - ${{ inputs.release && 'manual release' || 'manual debug' }} - ${{ github.ref_name }}

on:
  # コミット時はビルドしない (macOS runner の負荷・時間を抑えるため手動実行のみ)
  workflow_dispatch:
    inputs:
      release:
        description: "正式リリースビルド (診断コード無し・pawkemoviewer-v{VER} リリースへ添付)。無指定時はデバッグビルド"
        type: boolean
        default: false
      locale_test:
        description: "言語ファイル検証用のアプリ ID でビルド (デバッグ・成果物のみ)"
        type: boolean
        default: false
      artifact_only:
        description: "成果物を Actions にのみ保存"
        type: boolean
        default: false

# 同一ブランチの新しい iOS ビルドを優先し、古い実行中ビルドはキャンセルする
concurrency:
  group: ios-build-${{ github.ref }}-${{ inputs.release == true && 'release' || 'debug' }}-${{ inputs.locale_test && 'validation' || 'standard' }}
  cancel-in-progress: ${{ inputs.release != true }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    env:
      # push = デバッグビルド (診断コード VITE_DEBUG_DIAG=1 を注入)。
      # 手動 release=true のみ診断コード無しの正式リリースビルド。
      # 注意: `true && '' || '1'` は空文字が偽のため '1' になる。リリースは '0' を明示する
      VITE_DEBUG_DIAG: ${{ inputs.release == true && '0' || '1' }}
      # デバッグビルドの表記用ビルド番号 (バージョン番号は変えない)。リリースは 'release'
      VITE_BUILD_REV: ${{ inputs.release == true && 'release' || github.run_number }}
      VITE_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # リリースノート / サマリに直近のコミットメッセージを表示するため履歴を取得
          fetch-depth: 0
          persist-credentials: false

      - name: 製品版と検証モードの同時指定を拒否
        if: inputs.release && inputs.locale_test
        run: |
          echo "locale_test requires a debug build" >&2
          exit 1

      - name: Show recent commits
        shell: bash
        run: |
          {
            echo '### 最近のコミット (このビルド)'
            git log -5 --pretty=format:'- %h %s'
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # iOS 端末 (arm64) 向けの rust std を入れる
          targets: aarch64-apple-ios

      - name: Install XcodeGen
        # npx tauri ios init が Xcode プロジェクトを生成するのに必要
        run: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Install Dependencies
        run: npm ci

      - name: 言語検証用のアプリ ID を設定
        if: inputs.locale_test
        run: node scripts/ci/set-locale-test-id.mjs

      - name: Build Frontend
        # ジョブレベル env (VITE_DEBUG_DIAG) を使用
        run: npm run build

      - name: Generate native app icons
        # src-tauri/icons/ は git 管理外。init 前に dark から生成しておく
        run: npm run icons:generate

      - name: Initialize iOS project
        # src-tauri/gen/apple は git 管理外 (Android と同じく CI で毎回生成)
        run: npx tauri ios init

      - name: Apply primary (dark) app icon
        # init 後に実行すると tauri icon が gen/apple/Assets.xcassets/AppIcon.appiconset
        # へ直接書き込む (init 前だと src-tauri/icons/ios にしか生成されない)
        run: npx tauri icon src-tauri/app-icons/dark.png

      - name: Prepare alternate app icons in Xcode spec
        # tauri ios init が生成する project.yml に、代替アイコンの映射ブロックと
        # 全 AppIcon アセットをコンパイルする設定を入れる (冪等)。
        run: |
          node <<'NODE'
          const fs = require('fs')
          const p = 'src-tauri/gen/apple/project.yml'
          let s = fs.readFileSync(p, 'utf8')
          const start = '        # APP-ICON ALIASES START'
          const end = '        # APP-ICON ALIASES END'
          if (!s.includes(start)) {
            const m = s.match(/(\n[ \t]+properties:\n)/)
            if (!m) throw new Error('info.properties not found in project.yml')
            s = s.replace(m[0], m[0] + start + '\n' + end + '\n')
          }
          if (!s.includes('ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS')) {
            const m = s.match(/(\n[ \t]+ENABLE_BITCODE: false\n)/)
            if (!m) throw new Error('ENABLE_BITCODE not found in project.yml')
            s = s.replace(m[0], m[0] + '        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES\n')
          }
          fs.writeFileSync(p, s)
          NODE
          grep -nE 'APP-ICON ALIASES|INCLUDE_ALL_APPICON' src-tauri/gen/apple/project.yml

      - name: Generate alternate app icon (light)
        run: |
          node scripts/app-icon/generate-ios.mjs --config src-tauri/app-icons.json
          grep -n 'TauriAppIconAliases' src-tauri/gen/apple/project.yml

      - name: Regenerate Xcode project with alternate icons
        # tauri ios init が作った pbxproj / Info.plist はパッチ前に生成されている。
        # project.yml の映射・ビルド設定を反映させるため xcodegen を再実行する。
        run: |
          set -e
          cd src-tauri/gen/apple
          xcodegen generate --spec project.yml
          grep -n 'TauriAppIconAliases' PawKemoViewer_iOS/Info.plist
          grep -n 'ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS' PawKemoViewer.xcodeproj/project.pbxproj

      - name: Build unsigned iOS IPA (device / arm64)
        # 既定 target = aarch64 (iOS 端末)。--no-sign で CODE_SIGNING_ALLOWED=NO の
        # archive を作り、PawKemoViewer.ipa を生成する (Apple Developer 不要)。
        run: |
          if [ "${{ inputs.release }}" = "true" ]; then
            npx tauri ios build --no-sign
          else
            npx tauri ios build --no-sign --features debug-diag
          fi

      - name: Collect unsigned IPA
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          mkdir -p dist-ios
          shopt -s nullglob
          packages=(src-tauri/gen/apple/build/arm64/*.ipa)
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected one unsigned IPA, found ${#packages[@]}" >&2
            exit 1
          fi
          ipa=${packages[0]}
          out="dist-ios/PawKemoViewer_${VER}_ios-unsigned.ipa"
          cp "$ipa" "$out"
          echo "packaged: $out"
          ls -la dist-ios

      - name: Verify iPhone and iPad icons in the IPA
        run: |
          python3 - dist-ios/*.ipa <<'PYTHON'
          import plistlib
          import sys
          from zipfile import ZipFile

          with ZipFile(sys.argv[1]) as ipa:
              info_path, = (
                  name for name in ipa.namelist()
                  if name.startswith("Payload/") and name.count("/") == 2
                  and name.endswith(".app/Info.plist")
              )
              info = plistlib.loads(ipa.read(info_path))
              if set(info["UIDeviceFamily"]) != {1, 2}:
                  raise SystemExit("The IPA must target both iPhone and iPad")
              for key in ("CFBundleIcons", "CFBundleIcons~ipad"):
                  icons = info[key]
                  if "AppIconLight" not in icons["CFBundleAlternateIcons"]:
                      raise SystemExit(f"{key} is missing the light alternate icon")
              ipad_primary = info["CFBundleIcons~ipad"]["CFBundlePrimaryIcon"]
              if "AppIcon76x76" not in ipad_primary["CFBundleIconFiles"]:
                  raise SystemExit("The IPA is missing the iPad home screen icon")
          PYTHON

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: pawchive-ios
          path: dist-ios/*.ipa
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.artifact_only != true && inputs.locale_test != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: pawchive-ios
          path: artifacts

      - name: GitHub Releases に公開
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.release == true && 'release' || 'debug' }}
        run: bash scripts/ci/publish-build.sh ios "$BUILD_MODE" artifacts
