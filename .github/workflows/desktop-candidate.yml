name: Desktop candidate validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: windows
            bundle: nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - runner: macos-15
            platform: macos
            bundle: app
            artifact: artifacts/*.zip
          - runner: ubuntu-24.04
            platform: linux
            bundle: deb
            artifact: src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      VITE_DEBUG_DIAG: "1"
      VITE_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run icons:generate
      - name: Build diagnostic candidate package
        run: npx tauri build --features debug-diag --bundles ${{ matrix.bundle }}
      - name: Check Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer" }
          $bytes = [System.IO.File]::ReadAllBytes($installers[0].FullName)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Invalid Windows installer header" }
      - name: Check and archive macOS app
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app=src-tauri/target/release/bundle/macos/PawKemoViewer.app
          plist="$app/Contents/Info.plist"
          exe=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$plist")
          icon=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIconFile' "$plist")
          test -x "$app/Contents/MacOS/$exe"
          test -s "$app/Contents/Resources/$icon"
          mkdir -p artifacts
          ditto -c -k --keepParent "$app" artifacts/PawKemoViewer-macOS.zip
      - name: Check Linux package
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          unpacked=$(mktemp -d)
          dpkg-deb -x "${packages[0]}" "$unpacked"
          test -x "$unpacked/usr/bin/pawkemoviewer"
          test -n "$(find "$unpacked/usr/share/icons" -type f -name '*.png' -print -quit)"
      - uses: actions/upload-artifact@v6
        with:
          name: PawKemoViewer-Desktop-Test-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
