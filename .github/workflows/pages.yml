name: 紹介サイトを公開

# 正式リリースのアセットをプラットフォームごとに追跡し、gh-pages の release.json を更新する。
# Pages の公開元は gh-pages ブランチ (legacy) のため、Actions からのデプロイではなく
# ブランチへコミットする。5 プラットフォームが揃っていなくても、取得できた最新を公開する。
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Tauri, Android Build, iOS Build, macOS Build]
    types: [completed]

concurrency:
  group: pawkemoviewer-pages
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: gh-pages
          path: site

      - name: プラットフォームごとの最新アセットを選択
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          repository_url = f'{os.environ["GITHUB_SERVER_URL"].rstrip("/")}/{repo}'

          def api(path):
              output = subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"])
              return json.loads(output)

          patterns = {
              "windows": ("exe", r"x64-setup\.exe"),
              "macos": ("dmg", r"aarch64\.dmg"),
              "linux": ("AppImage", r"amd64\.AppImage"),
              "android": ("apk", r"universal\.apk"),
              "ios": ("ipa", r"ios-unsigned\.ipa"),
          }

          releases = api("releases?per_page=100")
          try:
              latest_tag = api("releases/latest")["tag_name"]
          except subprocess.CalledProcessError:
              latest_tag = None
          releases = sorted(
              [r for r in releases if not r["draft"] and not r["prerelease"] and r["published_at"]],
              key=lambda item: item["published_at"],
              reverse=True,
          )

          # 最新のリリースから順に、まだ見つかっていないプラットフォームのアセットを拾う。
          found = {}
          for release in releases:
              for platform, (extension, suffix) in patterns.items():
                  if platform in found:
                      continue
                  for asset in release["assets"]:
                      filename = f"PawKemoViewer.{extension}"
                      stable = asset["name"] == filename
                      match = (
                          re.fullmatch(r"pawkemoviewer-v(\d+\.\d+\.\d+)", release["tag_name"])
                          if stable else re.fullmatch(rf"PawKemoViewer_(\d+\.\d+\.\d+)_{suffix}", asset["name"])
                      )
                      if not match or asset["state"] != "uploaded" or asset["size"] <= 0:
                          continue
                      found[platform] = {
                          "version": f"v{match.group(1)}",
                          "name": asset["name"],
                          "url": (
                              f"{repository_url}/releases/latest/download/{filename}"
                              if stable and release["tag_name"] == latest_tag
                              else asset["browser_download_url"]
                          ),
                          "published": release["published_at"],
                          "release_url": release["html_url"],
                          "_parts": [int(part) for part in match.group(1).split(".")],
                      }
                      break
              if len(found) == len(patterns):
                  break

          latest = max(found.values(), key=lambda item: item["_parts"], default={})
          assets = {
              platform: {key: value for key, value in asset.items() if not key.startswith("_")}
              for platform, asset in found.items()
          }
          metadata = {
              "repository_url": repository_url,
              "version": latest.get("version"),
              "published": latest.get("published"),
              "url": latest.get("release_url", f"{repository_url}/releases/latest"),
              "assets": assets,
          }
          Path("site/release.json").write_text(
              json.dumps(metadata, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          summary = ", ".join(f"{platform}={asset['version']}" for platform, asset in assets.items())
          print("公開対象: " + summary)
          PY

      - name: サイトのリリース情報を更新
        working-directory: site
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.json
          if git diff --cached --quiet; then
            echo "release.json に変更はありません"
            exit 0
          fi
          git commit -m "紹介サイトのリポジトリとリリース情報を更新"
          git push origin HEAD:gh-pages
