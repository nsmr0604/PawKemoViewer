name: 紹介サイトを公開

# 正式リリースが完成したら、紹介サイト (gh-pages) の release.json を更新する。
# Pages の公開元は gh-pages ブランチ (legacy) のため、Actions からのデプロイではなく
# ブランチへコミットする。5 プラットフォームの成果物が揃ったリリースだけを対象にする。
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Tauri, Android Build, iOS Build, macOS Build]
    types: [completed]

concurrency:
  group: pawkemoviewer-pages
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: 完成した正式リリースを選択
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import quote

          repo = os.environ["GITHUB_REPOSITORY"]
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          run = event.get("workflow_run")

          def api(path):
              output = subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"])
              return json.loads(output)

          def collect(release):
              tag = release["tag_name"]
              match = re.fullmatch(r"pawkemoviewer-v(\d+\.\d+\.\d+)", tag)
              if not match or release["draft"] or release["prerelease"] or not release["published_at"]:
                  return
              version = match[1]
              prefix = f"PawKemoViewer_{version}_"
              patterns = {
                  "windows": r"x64-setup\.exe",
                  "macos": r"aarch64\.dmg",
                  "linux": r"amd64\.deb",
                  "android": r"universal\.apk",
                  "ios": r"ios-unsigned\.ipa",
              }
              assets = {}
              for platform, suffix in patterns.items():
                  matching = [
                      asset for asset in release["assets"]
                      if asset["state"] == "uploaded" and asset["size"] > 0
                      and re.fullmatch(re.escape(prefix) + suffix, asset["name"])
                  ]
                  if len(matching) != 1:
                      return
                  assets[platform] = matching[0]
              return version, assets

          releases = api("releases?per_page=50")
          selected = None
          for release in sorted(releases, key=lambda item: item["published_at"] or "", reverse=True):
              data = collect(release)
              if not data:
                  continue
              if run is None:
                  # 手動実行では最新の完成リリースを公開する。
                  selected = release, *data
                  break
              # ビルドを起動したコミットと、リリースタグのコミットが一致するものだけを公開する。
              tag = quote(release["tag_name"], safe="")
              sha = api(f"commits/{tag}")["sha"]
              if sha == run["head_sha"]:
                  selected = release, *data
                  break

          publish = selected is not None
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"publish={str(publish).lower()}", file=output)

          if not publish:
              print("公開対象の正式リリースはありません。5 プラットフォームの成果物が揃うまで待機します。")
              raise SystemExit(0)

          release, version, assets = selected
          metadata = {
              "version": f"v{version}",
              "published": release["published_at"],
              "url": release["html_url"],
              "assets": {platform: asset["browser_download_url"] for platform, asset in assets.items()},
          }
          Path("site/release.json").write_text(json.dumps(metadata) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"tag={release['tag_name']}", file=output)
          print(f"公開対象: {release['tag_name']}")
          PY

      - name: サイトのリリース情報を更新
        if: steps.release.outputs.publish == 'true'
        working-directory: site
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.json
          if git diff --cached --quiet; then
            echo "release.json に変更はありません"
            exit 0
          fi
          git commit -m "リリース情報を ${{ steps.release.outputs.tag }} に更新"
          git push origin HEAD:gh-pages
