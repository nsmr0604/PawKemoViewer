name: 紹介サイトを公開

# 正式リリースのアセットをプラットフォームごとに追跡し、gh-pages の release.json を更新する。
# Pages の公開元は gh-pages ブランチ (legacy) のため、Actions からのデプロイではなく
# ブランチへコミットする。5 プラットフォームが揃っていなくても、取得できた最新を公開する。
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Tauri, Android Build, iOS Build, macOS Build]
    types: [completed]

concurrency:
  group: pawkemoviewer-pages
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: プラットフォームごとの最新アセットを選択
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]

          def api(path):
              output = subprocess.check_output(["gh", "api", f"repos/{repo}/{path}"])
              return json.loads(output)

          patterns = {
              "windows": r"x64-setup\.exe",
              "macos": r"aarch64\.dmg",
              "linux": r"amd64\.deb",
              "android": r"universal\.apk",
              "ios": r"ios-unsigned\.ipa",
          }

          releases = api("releases?per_page=100")
          releases = sorted(
              [r for r in releases if not r["draft"] and not r["prerelease"] and r["published_at"]],
              key=lambda item: item["published_at"],
              reverse=True,
          )

          # 最新のリリースから順に、まだ見つかっていないプラットフォームのアセットを拾う。
          found = {}
          for release in releases:
              for platform, suffix in patterns.items():
                  if platform in found:
                      continue
                  for asset in release["assets"]:
                      match = re.fullmatch(rf"PawKemoViewer_(\d+\.\d+\.\d+)_{suffix}", asset["name"])
                      if not match or asset["state"] != "uploaded" or asset["size"] <= 0:
                          continue
                      found[platform] = {
                          "version": f"v{match.group(1)}",
                          "name": asset["name"],
                          "url": asset["browser_download_url"],
                          "published": release["published_at"],
                          "release_url": release["html_url"],
                          "_parts": [int(part) for part in match.group(1).split(".")],
                      }
                      break
              if len(found) == len(patterns):
                  break

          publish = len(found) > 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"publish={str(publish).lower()}", file=output)

          if not publish:
              print("公開できる正式リリースのアセットがありません。")
              raise SystemExit(0)

          latest = max(found.values(), key=lambda item: item["_parts"])
          assets = {
              platform: {key: value for key, value in asset.items() if not key.startswith("_")}
              for platform, asset in found.items()
          }
          metadata = {
              "version": latest["version"],
              "published": latest["published"],
              "url": latest["release_url"],
              "assets": assets,
          }
          Path("site/release.json").write_text(
              json.dumps(metadata, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"latest={latest['version']}", file=output)
          summary = ", ".join(f"{platform}={asset['version']}" for platform, asset in assets.items())
          print("公開対象: " + summary)
          PY

      - name: サイトのリリース情報を更新
        if: steps.release.outputs.publish == 'true'
        working-directory: site
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.json
          if git diff --cached --quiet; then
            echo "release.json に変更はありません"
            exit 0
          fi
          git commit -m "リリース情報を ${{ steps.release.outputs.latest }} に更新"
          git push origin HEAD:gh-pages
