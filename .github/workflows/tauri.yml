name: Build Tauri

on:
  push:
    branches:
      - main
    # ビルド関連ファイルの変更時のみ発火 (ドキュメントのみのコミットではスキップ)
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tauri.yml"

  workflow_dispatch:

# 同一ブランチの新しいPCビルドを優先し、古い実行中ビルドはキャンセルする
concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove previous PC build assets for this version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="pawchive-v${VER}"

          # 同じバージョンの既存リリースからPC向け成果物だけを削除する。
          # Android APKはAndroid workflowが管理するため残す。
          if gh release view "$TAG" >/dev/null 2>&1; then
            mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            for asset in "${assets[@]}"; do
              if [[ "$asset" == Pawchive.Viewer* && "$asset" != *.apk ]]; then
                gh release delete-asset "$TAG" "$asset" --yes
                echo "removed previous PC asset: $asset"
              fi
            done
          fi

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: ubuntu-24.04
          - platform: macos-15

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: pawchive-v__VERSION__
          releaseName: Pawchive Viewer v__VERSION__
          releaseBody: |
            Automated build.

            Supported platforms:

            - Windows
            - Linux
            - macOS
          releaseDraft: false
          prerelease: false
