name: Build Tauri
run-name: ${{ github.workflow }} - ${{ inputs.release == true && 'release' || 'debug' }} - ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      # バージョン番号のブランチ (例: 0.6.0) でも開発ビルドを作る
      - "[0-9]*.[0-9]*.[0-9]*"
    # ビルド関連ファイルの変更時のみ発火 (ドキュメントのみのコミットではスキップ)
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/app-icon/**"
      - "scripts/generate-icons.mjs"
      - "scripts/check-locales.mjs"
      - "scripts/ci/publish-build.sh"
      - "scripts/ci/stage-desktop-assets.mjs"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "正式リリースビルド (診断コード無し・pawkemoviewer-v{VER} リリースへ添付)。無指定時はデバッグビルド"
        type: boolean
        default: false
      windows_smoke:
        description: "Windows のインストールと起動を検証 (デバッグ・成果物のみ)"
        type: boolean
        default: false
      linux_smoke:
        description: "Linux に DEB をインストールして起動と公開 API を検証 (デバッグ・成果物のみ)"
        type: boolean
        default: false
      artifact_only:
        description: "成果物を Actions にのみ保存"
        type: boolean
        default: false

concurrency:
  group: desktop-build-${{ github.ref }}-${{ inputs.release == true && 'release' || 'debug' }}-${{ (inputs.linux_smoke || inputs.windows_smoke) && 'validation' || 'standard' }}
  cancel-in-progress: ${{ inputs.release != true }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VITE_DEBUG_DIAG: ${{ inputs.release == true && '0' || '1' }}
      VITE_BUILD_REV: ${{ inputs.release == true && 'release' || github.run_number }}
      VITE_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 製品版と起動検証の同時指定を拒否
        if: inputs.release && (inputs.linux_smoke || inputs.windows_smoke)
        shell: bash
        run: |
          echo "Installation checks require a debug build" >&2
          exit 1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 開発版のバージョン
        if: inputs.release != true
        shell: bash
        run: node scripts/dev-version.mjs

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux のビルド依存をインストール
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: npm run icons:generate

      - name: Tauri をビルド
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.release == true && 'release' || 'debug' }}
        run: |
          if [[ "$BUILD_MODE" == release ]]; then
            npx tauri build
          else
            npx tauri build --features debug-diag
          fi

      - name: Windows インストーラーを検査
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer" }
          $bytes = [System.IO.File]::ReadAllBytes($installers[0].FullName)
          if ($bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Invalid Windows installer header" }

      - name: Linux パッケージを検査
        if: runner.os == 'Linux'
        run: |
          shopt -s nullglob
          packages=(src-tauri/target/release/bundle/deb/*.deb)
          test "${#packages[@]}" -eq 1
          unpacked=$(mktemp -d)
          trap 'rm -rf "$unpacked"' EXIT
          dpkg-deb -x "${packages[0]}" "$unpacked"
          test -x "$unpacked/usr/bin/pawkemoviewer"
          test -n "$(find "$unpacked/usr/share/icons" -type f -name '*.png' -print -quit)"

      - name: 配布用ファイル名を設定
        env:
          BUILD_MODE: ${{ inputs.release == true && 'release' || 'debug' }}
        run: node scripts/ci/stage-desktop-assets.mjs desktop "$BUILD_MODE" src-tauri/target/release/bundle dist-packages
        shell: bash

      - uses: actions/upload-artifact@v6
        with:
          name: PawKemoViewer-${{ matrix.runner }}
          path: dist-packages/*
          if-no-files-found: error

      - name: Linux のインストールと起動を検証
        if: runner.os == 'Linux' && inputs.linux_smoke
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y "$PWD"/src-tauri/target/release/bundle/deb/*.deb \
            xvfb xauth dbus-x11 at-spi2-core python3-pyatspi
          xvfb-run -a --server-args="-screen 0 1280x900x24" dbus-run-session -- \
            /usr/bin/python3 tests/linux_installed_smoke.py

      - uses: actions/setup-python@v6
        if: runner.os == 'Windows' && inputs.windows_smoke
        with:
          python-version: "3.12"

      - name: Windows にインストールして起動
        if: runner.os == 'Windows' && inputs.windows_smoke
        shell: pwsh
        timeout-minutes: 12
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = 'Stop'
          $installer, $extra = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if (-not $installer -or $extra) { throw 'NSIS インストーラーは1個必要です' }
          $target = Join-Path $env:RUNNER_TEMP 'PawKemoViewer'
          $result = Start-Process $installer.FullName -ArgumentList '/S', "/D=$target" -PassThru -Wait
          if ($result.ExitCode -ne 0) { throw "NSIS が終了コード $($result.ExitCode) を返しました" }
          python tests/desktop_installed_smoke.py "$target/pawkemoviewer.exe"

  publish:
    needs: build
    if: inputs.artifact_only != true && inputs.linux_smoke != true && inputs.windows_smoke != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: PawKemoViewer-*
          path: artifacts

      - name: GitHub Releases に公開
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.release == true && 'release' || 'debug' }}
        run: bash scripts/ci/publish-build.sh desktop "$BUILD_MODE" artifacts
