name: Build Tauri
run-name: ${{ github.workflow }} - ${{ inputs.release == true && 'release' || 'debug' }} - ${{ github.ref_name }}

on:
  push:
    branches:
      - main
    # ビルド関連ファイルの変更時のみ発火 (ドキュメントのみのコミットではスキップ)
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/app-icon/**"
      - "scripts/generate-icons.mjs"
      - "scripts/ci/publish-build.sh"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "正式リリースビルド (診断コード無し・pawkemoviewer-v{VER} リリースへ添付)。無指定時はデバッグビルド"
        type: boolean
        default: false
      artifact_only:
        description: "成果物を Actions にのみ保存"
        type: boolean
        default: false

concurrency:
  group: desktop-build-${{ github.ref }}-${{ inputs.release == true && 'release' || 'debug' }}
  cancel-in-progress: ${{ inputs.release != true }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      VITE_DEBUG_DIAG: ${{ inputs.release == true && '0' || '1' }}
      VITE_BUILD_REV: ${{ inputs.release == true && 'release' || github.run_number }}
      VITE_BUILD_COMMIT: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux のビルド依存をインストール
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci
      - run: npm run icons:generate

      - name: Tauri をビルド
        shell: bash
        env:
          BUILD_MODE: ${{ inputs.release == true && 'release' || 'debug' }}
        run: |
          if [[ "$BUILD_MODE" == release ]]; then
            npx tauri build
          else
            npx tauri build --features debug-diag
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: PawKemoViewer-${{ matrix.runner }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error

  publish:
    needs: build
    if: inputs.artifact_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: PawKemoViewer-*
          path: artifacts

      - name: GitHub Releases に公開
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_MODE: ${{ inputs.release == true && 'release' || 'debug' }}
        run: bash scripts/ci/publish-build.sh desktop "$BUILD_MODE" artifacts
