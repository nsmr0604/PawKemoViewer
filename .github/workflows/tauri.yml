name: Build Tauri

on:
  push:
    branches:
      - main
    # ビルド関連ファイルの変更時のみ発火 (ドキュメントのみのコミットではスキップ)
    paths:
      - "src/**"
      - "src-tauri/**"
      - "public/**"
      - "index.html"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tauri.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "正式リリースビルド (診断コード無し・pawkemoviewer-v{VER} リリースへ添付)。無指定時はデバッグビルド"
        type: boolean
        default: false

# 同一ブランチの新しいPCビルドを優先し、古い実行中ビルドはキャンセルする
concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove previous PC build assets for this version (正式リリース時)
        if: ${{ inputs.release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG="pawkemoviewer-v${VER}"

          # 同じバージョンの既存リリースからPC向け成果物だけを削除する。
          # Android APKはAndroid workflowが管理するため残す。
          if gh release view "$TAG" >/dev/null 2>&1; then
            mapfile -t assets < <(gh release view "$TAG" --json assets --jq '.assets[].name')
            for asset in "${assets[@]}"; do
              if [[ "$asset" == PawKemoViewer* && "$asset" != *.apk ]]; then
                gh release delete-asset "$TAG" "$asset" --yes
                echo "removed previous PC asset: $asset"
              fi
            done
          fi

      - name: Clean debug prerelease assets (デバッグビルド時)
        if: ${{ inputs.release != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER=$(jq -r '.version' src-tauri/tauri.conf.json)
          TAG=debug-latest

          # rolling prerelease debug-latest から現行バージョン以外のアセットを掃除
          # (バージョンはファイル名に含まれる。PC/APK 両方に同じフィルタが使える)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              case "$asset" in
                *"_${VER}_"*) ;; # 現行バージョンは残す
                *) gh release delete-asset "$TAG" "$asset" --yes || true
                   echo "removed stale debug asset: $asset" ;;
              esac
            done
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      # push (コミット時) は Windows / Linux のみ。macOS は手動実行時だけビルドする
      matrix:
        platform: ${{ fromJSON(github.event_name == 'push' && '["windows-latest", "ubuntu-24.04"]' || '["windows-latest", "ubuntu-24.04", "macos-15"]') }}

    runs-on: ${{ matrix.platform }}

    env:
      # push = デバッグビルド (診断コード VITE_DEBUG_DIAG=1 を注入)。
      # 手動 release=true のみ診断コード無しの正式リリースビルド。
      # ジョブレベルで設定する (tauri-action の beforeBuildCommand でも同じフラグを使うため)。
      # 注意: `true && '' || '1'` は空文字が偽のため '1' になる。リリースは '0' を明示する
      VITE_DEBUG_DIAG: ${{ inputs.release == true && '0' || '1' }}
      # デバッグビルドの表記用ビルド番号 (バージョン番号は変えない)。リリースは 'release'
      VITE_BUILD_REV: ${{ inputs.release == true && 'release' || github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        # ジョブレベル env (VITE_DEBUG_DIAG) を使用
        run: npm run build

      - name: Generate native app icons
        # src-tauri/icons/ は git 管理外。2 枚の元画像のうち dark から全サイズを生成する
        run: npm run icons:generate

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.release == true && 'pawkemoviewer-v__VERSION__' || 'debug-latest' }}
          releaseName: ${{ inputs.release == true && 'PawKemoViewer v__VERSION__' || 'PawKemoViewer debug build' }}
          releaseBody: ${{ inputs.release == true && 'Automated release build.' || 'Automated debug build. デバッグ診断コード有効 (VITE_DEBUG_DIAG=1・テスト用・非公式).' }}
          releaseDraft: false
          prerelease: ${{ inputs.release != true }}
          args: ${{ inputs.release == true && '' || '--features debug-diag' }}
