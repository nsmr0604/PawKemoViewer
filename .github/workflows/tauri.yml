name: Build Tauri

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:

  build:

    strategy:
      fail-fast: false

      matrix:
        include:

          - platform: windows-latest

          - platform: ubuntu-24.04

          - platform: macos-15

    runs-on: ${{ matrix.platform }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt update

          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        with:
          tagName: pawchive-v__VERSION__
          releaseName: Pawchive Viewer v__VERSION__
          releaseBody: |
            Automated build.

            Supported platforms:

            - Windows
            - Linux
            - macOS

          releaseDraft: false
          prerelease: false
