[package]
name = "pawkemoviewer"
version = "0.3.2"
description = "PawKemoViewer"
authors = ["nsmr0604"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# デバッグビルド向け詳細トレースのフラグ。
# 開発用のログ操作コマンドは製品版の設定トグルからも利用するため常時登録し、
# HTTP request/method/status 等の詳細 println! のみ #[cfg(feature = "debug-diag")] で囲む。
[features]
debug-diag = []

[lib]
name = "pawkemoviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"

# Logging
log = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "cookies",
  "gzip",
  "brotli",
  "deflate",
  "rustls-tls",
  "blocking"
] }

regex = "1"

# クリエイターアイコンの data URL 変換 (fetch_creator_icon)
base64 = "0.22"

