[package]
name = "app"
version = "0.1.7"
description = "Pawchive Viewer"
authors = ["nsmr0604"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"

# Logging
log = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "cookies",
  "gzip",
  "brotli",
  "deflate",
  "rustls-tls",
  "blocking"
] }

regex = "1"
