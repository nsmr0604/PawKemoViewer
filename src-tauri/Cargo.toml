[package]
name = "pawkemoviewer"
version = "0.6.2"
description = "PawKemoViewer"
authors = ["nsmr0604"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# Full 開発診断のビルドフラグ。
# 製品版では詳細ログ操作コマンドをコンパイル・登録しない。
[features]
debug-diag = ["tauri-plugin-external-view/debug-diag"]

[lib]
name = "pawkemoviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-app-icon = "0.1.0"

# Logging
log = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "cookies",
  "gzip",
  "brotli",
  "deflate",
  "rustls-tls",
  "blocking"
] }

regex = "1"

# クリエイターアイコンの data URL 変換 (fetch_creator_icon)
base64 = "0.22"


[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-locale-picker = { path = "plugins/locale-picker" }
tauri-plugin-external-view = { path = "plugins/external-view" }

# Android の共有 Downloads (MediaStore) への保存
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-downloads-store = { path = "plugins/downloads-store" }

# デスクトップの外部ページビュー (Referer 付きナビゲーション)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSURL", "NSURLRequest", "NSString"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
getrandom = "0.3"
